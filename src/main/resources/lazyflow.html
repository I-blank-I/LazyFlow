<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LazyFlow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap');
  :root {
    --bg:#0a0c10;--surface:#111318;--border:#1e2128;--border2:#2a2f3a;
    --text:#c9d1d9;--muted:#6e7681;--accent:#58a6ff;
    --req-head:#1a2744;--res-head:#1a2a1a;--req-col:#58a6ff;--res-col:#3fb950;
    --left-w:220px;--right-w:360px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;min-height:100vh;overflow-x:hidden;}
  header{position:sticky;top:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:14px;}
  header h1{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
  .upload-zone{display:flex;align-items:center;gap:10px;flex:1;}
  .upload-label{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px dashed var(--border2);border-radius:6px;cursor:pointer;color:var(--muted);font-size:11px;transition:border-color .2s,background .2s;}
  .upload-label:hover,.upload-label.dragover{border-color:var(--accent);color:var(--accent);background:#58a6ff11;}
  #file-input{display:none;}
  #filename{font-size:11px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stats{margin-left:auto;display:flex;gap:14px;font-size:11px;color:var(--muted);}
  .stats span{white-space:nowrap;}.stats b{color:var(--text);}
  .panel-toggle-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border2);border-radius:5px;background:transparent;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;}
  .panel-toggle-btn:hover{border-color:var(--accent);color:var(--accent);background:#58a6ff0a;}
  .panel-toggle-btn.active{border-color:var(--accent);color:var(--accent);background:#58a6ff18;}
  .layout{display:flex;height:calc(100vh - 49px);overflow:hidden;}
  .left-panel{width:var(--left-w);flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease,opacity .2s ease;}
  .left-panel.collapsed{width:0;opacity:0;pointer-events:none;}
  .left-panel-header{padding:10px 12px;border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .left-panel-actions{display:flex;gap:6px;}
  .tiny-btn{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border:1px solid var(--border2);border-radius:3px;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;}
  .tiny-btn:hover{border-color:var(--accent);color:var(--accent);}
  .left-panel-content{flex:1;overflow-y:auto;padding:8px;}
  .vis-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;transition:background .1s;margin-bottom:2px;}
  .vis-row:hover{background:#ffffff08;}

<body>

<div class="layout">

<script>
'use strict';

const COLORS = [
  "#FF6B6B","#FFD93D","#6BCB77","#4D96FF","#FF922B","#CC5DE8","#20C997",
  "#F06595","#74C0FC","#A9E34B","#FF8787","#FFA94D","#69DB7C","#4DABF7",
  "#E599F7","#63E6BE","#F783AC","#91A7FF","#C0EB75","#FFD43B",
];

const MIN_LEN = 4;
const BORING  = new Set([
  "text/html","application/json","keep-alive","close","chunked","gzip",
  "no-cache","no-store","200 ok","true","false","text/html; charset=utf-8",
  "application/json; charset=utf-8","application/x-www-form-urlencoded","0","1","utf-8",
]);
const SKIP_REQ_HEADERS = new Set([
  "host","user-agent","accept","accept-language","accept-encoding","connection",
  "upgrade-insecure-requests","priority","origin","content-type","content-length",
  "cache-control","pragma","x-pwnfox-color","referer","sec-fetch-site",
  "sec-fetch-mode","sec-fetch-dest","sec-fetch-user","te",
]);

// ── utilities ─────────────────────────────────────────────────────────────────

function isInteresting(v) {
  v = v.trim();
  if (v.length < MIN_LEN) return false;
  if (BORING.has(v.toLowerCase())) return false;
  if (/^\d+$/.test(v) && v.length < 5) return false;
  return true;
}

function parseQS(qs) {
  const out = new Map();
  if (!qs) return out;
  for (const part of qs.split('&')) {
    const eq  = part.indexOf('=');
    if (eq === -1) continue;
    const key = safeDecodeURI(part.slice(0, eq).replace(/\+/g,' '));
    const val = safeDecodeURI(part.slice(eq+1).replace(/\+/g,' '));
    if (!out.has(key)) out.set(key, []);
    out.get(key).push(val);
  }
  return out;
}

function parseQSRaw(qs) {
  const out = new Map();
  if (!qs) return out;
  for (const part of qs.split('&')) {
    const eq  = part.indexOf('=');
    if (eq === -1) continue;
    const key = safeDecodeURI(part.slice(0, eq).replace(/\+/g,' '));
    const val = part.slice(eq+1);
    if (!out.has(key)) out.set(key, []);
    out.get(key).push(val);
  }
  return out;
}

function pathSegments(raw) {
  if (!raw) return [];
  let p = raw;
  const schemeIdx = p.indexOf('://');
  if (schemeIdx !== -1) {
    const afterHost = p.indexOf('/', schemeIdx + 3);
    p = afterHost === -1 ? '' : p.slice(afterHost);
  }
  p = p.split('?')[0].split('#')[0];
  return p.split('/').filter(Boolean).map(safeDecodeURI);
}

function safeDecodeURI(s) { try { return decodeURIComponent(s); } catch { return s; } }

function flattenJSON(obj, prefix) {
  prefix = prefix || '';
  if (obj === null || typeof obj !== 'object') return [[prefix, String(obj)]];
  const out = [];
  if (Array.isArray(obj)) {
    obj.forEach((v,i) => out.push(...flattenJSON(v, prefix ? `${prefix}[${i}]` : `[${i}]`)));
  } else {
    for (const [k,v] of Object.entries(obj))
      out.push(...flattenJSON(v, prefix ? `${prefix}.${k}` : k));
  }
  return out;
}

// ── HTTP parsing ──────────────────────────────────────────────────────────────

function parseRawHTTP(raw, index, kind) {
  const msg = { index, kind, raw, method:null, path:null, status:null, headers: new Map(), body:'' };
  const lines = raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  if (!lines.length) return msg;

  const parts0 = lines[0].split(' ');
  if (kind === 'request') {
    msg.method = parts0[0] || null;
    msg.path   = parts0[1] || null;
  } else {
    const code = parseInt(parts0[1]);
    msg.status = isNaN(code) ? null : code;
  }

  let i = 1;
  while (i < lines.length && lines[i].trim() !== '') {
    const colon = lines[i].indexOf(':');
    if (colon !== -1) {
      const k = lines[i].slice(0, colon).trim().toLowerCase();
      const v = lines[i].slice(colon+1).trim();
      if (msg.headers.has(k)) {
        const ex = msg.headers.get(k);
        Array.isArray(ex) ? ex.push(v) : msg.headers.set(k, [ex, v]);
      } else msg.headers.set(k, v);
    }
    i++;
  }
  msg.body = lines.slice(i+1).join('\n').trim();
  return msg;
}

function loadPairsFromText(content) {
  content = content.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const parts = content.split(/^===(REQUEST|RESPONSE)===$/m).slice(1);
  if (parts.length % 4 !== 0)
    throw new Error(`Malformed input: expected REQUEST+RESPONSE pairs, got ${parts.length} sections`);
  const pairs = [];
  for (let i = 0; i < parts.length; i += 4) {
    if (parts[i] !== 'REQUEST' || parts[i+2] !== 'RESPONSE')
      throw new Error(`Expected REQUEST then RESPONSE at pair ${i/4}`);
    pairs.push({ request: parts[i+1].trim(), response: parts[i+3].trim() });
  }
  return pairs;
}

// ── extraction from response ──────────────────────────────────────────────────

function extractFromResponse(res) {
  const extracted = [], seen = new Set();
  function add(value, location) {
    for (const v of new Set([value, safeDecodeURI(value)])) {
      const vt = v.trim();
      if (isInteresting(vt) && !seen.has(vt)) {
        seen.add(vt);
        extracted.push({ value:vt, source_index:res.index, source_location:location });
      }
    }
  }

  for (const [k, v] of res.headers) {
    const vals = Array.isArray(v) ? v : [v];
    for (const hval of vals) {
      if (k === 'set-cookie') {
        for (const part of hval.split(';')) {
          const eq = part.indexOf('=');
          if (eq !== -1) add(part.slice(eq+1).trim(), `header:set-cookie:${part.slice(0,eq).trim()}`);
        }
        add(hval, 'header:set-cookie');
      } else {
        add(hval, `header:${k}`);
        if (hval.includes('?')) {
          try {
            const qs = hval.slice(hval.indexOf('?')+1);
            for (const [p, pv] of parseQS(qs)) for (const pval of pv) add(pval, `header:${k}:queryparam:${p}`);
            for (const [p, pv] of parseQSRaw(qs)) for (const pval of pv) add(pval, `header:${k}:queryparam:${p}`);
          } catch {}
        }
        if (hval.startsWith('/') || hval.includes('://')) {
          pathSegments(hval).forEach((seg, i) => add(seg, `header:${k}:pathsegment:${i}`));
        }
      }
    }
  }

  if (!res.body) return extracted;

  try {
    const data = JSON.parse(res.body);
    for (const [loc, val] of flattenJSON(data)) add(val, `body:json:${loc}`);
    return extracted;
  } catch {}

  try {
    const doc = new DOMParser().parseFromString(res.body, 'text/html');
    for (const el of doc.querySelectorAll('input[type="hidden"]'))
      add(el.getAttribute('value')||'', `body:html:hidden_input:${el.getAttribute('name')||'?'}`);
    for (const el of doc.querySelectorAll('meta'))
      add(el.getAttribute('content')||'', `body:html:meta:${el.getAttribute('name')||el.getAttribute('property')||'?'}`);
    for (const el of doc.querySelectorAll('script')) {
      const src = el.textContent||'';
      for (const m of src.matchAll(/(\w+)\s*=\s*["']([^"']{4,})["']/g))
        add(m[2], `body:html:script:${m[1]}`);
    }
  } catch {}

  try { for (const [k, pv] of parseQS(res.body)) for (const v of pv) add(v, `body:form:${k}`); } catch {}
  try { for (const [k, pv] of parseQSRaw(res.body)) for (const v of pv) add(v, `body:form:${k}`); } catch {}

  for (const line of res.body.split('\n')) {
    const lt = line.trim();
    if (isInteresting(lt) && /^[\w\-\.=+/]+$/.test(lt)) add(lt, 'body:raw_line');
  }
  return extracted;
}

// ── search in request ─────────────────────────────────────────────────────────

function searchInRequest(req, value) {
  const v = value.trim(), locs = [];

  for (const [k, hv] of req.headers) {
    const vals = Array.isArray(hv) ? hv : [hv];
    if (vals.some(h => h.includes(v))) locs.push(`header:${k}`);
  }

  if (req.path) {
    if (req.path.includes('?')) {
      const qs = req.path.slice(req.path.indexOf('?')+1);
      if (qs.includes(v)) {
        let matched = false;
        for (const [p, pv] of parseQS(qs)) {
          if (pv.some(pval => pval.includes(v))) { locs.push(`url_param:${p}`); matched = true; }
        }
        if (!matched) locs.push('url_query_raw');
      }
    }
    const pathOnly = req.path.split('?')[0];
    if (pathOnly.includes(v)) {
      const segs = pathSegments(pathOnly);
      const segIdx = segs.findIndex(s => s.includes(v));
      locs.push(segIdx !== -1 ? `url_path_segment:${segIdx}` : 'url_path_raw');
    }
  }

  if (req.body && req.body.includes(v)) {
    try { for (const [loc, val] of flattenJSON(JSON.parse(req.body))) if (String(val).includes(v)) locs.push(`body:json:${loc}`); } catch {}
    try { for (const [p, pv] of parseQS(req.body)) if (pv.some(pval => pval.includes(v))) locs.push(`body:form:${p}`); } catch {}
    if (!locs.some(l => l.startsWith('body:'))) locs.push('body:raw');
  }
  return locs;
}

// ── extract from request (reverse pass) ──────────────────────────────────────

function extractFromRequest(req) {
  const results = [];
  for (const [k, hv] of req.headers) {
    if (SKIP_REQ_HEADERS.has(k)) continue;
    const vals = Array.isArray(hv) ? hv : [hv];
    for (const hval of vals) {
      if (k === 'cookie') {
        for (const part of hval.split(';')) {
          const eq = part.indexOf('=');
          if (eq !== -1) { const val = part.slice(eq+1).trim(); if (isInteresting(val)) results.push([val, `header:cookie:${part.slice(0,eq).trim()}`]); }
        }
      } else if (isInteresting(hval)) results.push([hval, `header:${k}`]);
    }
  }
  if (req.path && req.path.includes('?')) {
    const qs = req.path.slice(req.path.indexOf('?')+1);
    for (const [p, pv] of parseQS(qs)) for (const v of pv) if (isInteresting(v)) results.push([v, `url_param:${p}`]);
    for (const [p, pv] of parseQSRaw(qs)) for (const v of pv) if (isInteresting(v)) results.push([v, `url_param:${p}`]);
  }
  if (req.path) {
    const pathOnly = req.path.split('?')[0];
    pathSegments(pathOnly).forEach((seg, i) => { if (isInteresting(seg)) results.push([seg, `url_path_segment:${i}`]); });
  }
  if (req.body) {
    try { for (const [loc, val] of flattenJSON(JSON.parse(req.body))) if (isInteresting(String(val))) results.push([String(val), `body:json:${loc}`]); } catch {}
    try { for (const [p, pv] of parseQS(req.body)) for (const v of pv) if (isInteresting(v)) results.push([v, `body:form:${p}`]); } catch {}
    try { for (const [p, pv] of parseQSRaw(req.body)) for (const v of pv) if (isInteresting(v)) results.push([v, `body:form:${p}`]); } catch {}
  }
  return results;
}

// ── search in response (reverse pass) ────────────────────────────────────────

function searchInResponse(res, value) {
  const v = value.trim(), locs = [];
  for (const [k, hv] of res.headers) {
    const vals = Array.isArray(hv) ? hv : [hv];
    if (vals.some(h => h.includes(v))) locs.push(`header:${k}`);
  }
  if (res.body && res.body.includes(v)) {
    try { for (const [loc, val] of flattenJSON(JSON.parse(res.body))) if (String(val).includes(v)) locs.push(`body:json:${loc}`); } catch {}
    if (!locs.some(l => l.startsWith('body:'))) locs.push('body:raw');
  }
  return locs;
}

// ── correlate ─────────────────────────────────────────────────────────────────

function correlate(pairs) {
  const allExtracted = [];
  for (const [, res] of pairs) allExtracted.push(...extractFromResponse(res));

  const correlations = [], alreadyCorr = new Set();

  // forward pass
  for (const ev of allExtracted) {
    for (const [req] of pairs) {
      if (req.index <= ev.source_index) continue;
      for (const loc of searchInRequest(req, ev.value)) {
        correlations.push({ extracted:ev, used_in_request_index:req.index, used_at_location:loc });
        alreadyCorr.add(ev.value);
      }
    }
  }

  // reverse pass
  for (const [req] of pairs) {
    for (const [val, reqLoc] of extractFromRequest(req)) {
      if (alreadyCorr.has(val)) continue;
      for (const [, res] of pairs) {
        if (res.index > req.index) continue;
        for (const resLoc of searchInResponse(res, val)) {
          correlations.push({ extracted:{ value:val, source_index:res.index, source_location:resLoc }, used_in_request_index:req.index, used_at_location:reqLoc });
          alreadyCorr.add(val);
        }
      }
    }
  }
  return { correlations, allExtracted };
}

// ── color assignment ──────────────────────────────────────────────────────────

function assignColors(correlations) {
  const corrVals = new Set(correlations.map(c => c.extracted.value));
  // Drop v only when the contained value o is a SUBSTANTIAL chunk of it —
  // not just a short, coincidental substring (e.g. the word "code" showing up
  // inside "slashid-code:AbC123..."). Otherwise a spurious short correlated
  // value can wipe out a real, unrelated, much longer one.
  const MIN_CONTAINED_LEN = 8, MIN_CONTAINED_RATIO = 0.5;
  const clean = [...corrVals].filter(v => ![...corrVals].some(o =>
    o !== v && v.includes(o) && o.length >= MIN_CONTAINED_LEN && o.length >= v.length * MIN_CONTAINED_RATIO
  ));
  const colorMap = new Map();
  [...clean].sort().forEach((v,i) => colorMap.set(v, COLORS[i % COLORS.length]));
  return colorMap;
}

// ── highlight ─────────────────────────────────────────────────────────────────

function escHtmlRaw(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlightText(raw, colorMap, suppress) {
  suppress = suppress || null;
  let segments = [escHtmlRaw(raw)];
  const allEsc = [...colorMap.keys()].map(v => escHtmlRaw(v));
  function isSuperstring(val) {
    const ev = escHtmlRaw(val);
    const MIN_CONTAINED_LEN = 8, MIN_CONTAINED_RATIO = 0.5;
    return allEsc.some(o => o !== ev && ev.includes(o) && o.length >= MIN_CONTAINED_LEN && o.length >= ev.length * MIN_CONTAINED_RATIO);
  }

  for (const val of [...colorMap.keys()].sort((a,b) => b.length - a.length)) {
    if (isSuperstring(val)) continue;
    if (suppress && suppress.has(val)) continue;
    const color = colorMap.get(val), esc = escHtmlRaw(val);
    if (!esc) continue;
    const open  = `<mark class="corr-mark" style="background:${color}22;color:${color};border:1px solid ${color}88;border-radius:3px;padding:0 2px;" data-value="${esc}">`;
    const close = '</mark>';
    const next = [];
    for (const seg of segments) {
      if (seg.startsWith('<') || !seg.includes(esc)) { next.push(seg); continue; }
      const parts = seg.split(esc);
      parts.forEach((p,i) => { next.push(p); if (i < parts.length-1) next.push(open, esc, close); });
    }
    segments = next;
  }
  return segments.join('');
}

// ── main analyze ──────────────────────────────────────────────────────────────

function analyzeFlowText(content) {
  const rawPairs = loadPairsFromText(content);
  const pairs    = rawPairs.map((p, idx) => [
    parseRawHTTP(p.request,  idx, 'request'),
    parseRawHTTP(p.response, idx, 'response'),
  ]);

  const { correlations } = correlate(pairs);
  const colorMap = assignColors(correlations);

  // earliest response occurrence per value — this is the true "extraction point".
  // Later responses that happen to contain the same value are NOT a new
  // extraction, just a coincidental repeat, so we don't highlight them there.
  // Requests are unaffected: every usage of a correlated value in a request
  // is still meaningful and stays highlighted.
  const siMap = new Map(), slMap = new Map();
  for (const c of correlations) {
    const v = c.extracted.value; if (!colorMap.has(v)) continue;
    const si = c.extracted.source_index;
    if (!siMap.has(v) || si < siMap.get(v)) { siMap.set(v, si); slMap.set(v, c.extracted.source_location); }
  }

  const pairData = pairs.map(([req, res]) => {
    const responseSuppress = new Set();
    for (const v of colorMap.keys()) {
      const earliest = siMap.get(v);
      if (earliest !== undefined && res.index !== earliest) responseSuppress.add(v);
    }
    return {
      index:            req.index,
      request_raw:      req.raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n/g,'\r\n'),
      response_raw:     res.raw,
      request_hl:       highlightText(req.raw, colorMap),
      response_hl:      highlightText(res.raw, colorMap, responseSuppress),
      request_summary:  req.method ? `${req.method} ${req.path}` : req.raw.split('\n')[0],
      response_summary: res.status ? String(res.status) : res.raw.split('\n')[0],
    };
  });

  const groups = new Map();
  for (const c of correlations) {
    const key = `${c.extracted.source_index}__${c.used_in_request_index}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  }
  const corrData = [];
  for (const [, corrs] of [...groups.entries()].sort()) {
    for (const c of corrs) {
      if (!colorMap.has(c.extracted.value)) continue;
      corrData.push({ value:c.extracted.value, color:colorMap.get(c.extracted.value), src_index:c.extracted.source_index, src_location:c.extracted.source_location, dst_index:c.used_in_request_index, dst_location:c.used_at_location });
    }
  }

  const legend = [...colorMap.entries()].map(([v, color]) => ({
    value:v, color, source_index:siMap.get(v)??0, source_location:slMap.get(v)??''
  }));

  return { pairs:pairData, correlations:corrData, legend, pair_count:pairs.length, corr_count:correlations.length };
}

// ═══════════════════════════════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════════════════════════════

let activeValue=null, activeEntry=null, hiddenValues=new Set();

function togglePanel(side) {
  const panel=document.getElementById(side+'-panel'), btn=document.getElementById('btn-'+side);
  panel.classList.toggle('collapsed');
  btn.classList.toggle('active', !panel.classList.contains('collapsed'));
}

const fileInput=document.getElementById('file-input'), dropZone=document.getElementById('drop-zone'), fnLabel=document.getElementById('filename');
fileInput.addEventListener('change', e => { const f=e.target.files[0]; if(f) processFile(f); });
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); const f=e.dataTransfer.files[0]; if(f){fileInput.files=e.dataTransfer.files;processFile(f);} });

function processFile(file) {
  fnLabel.textContent=file.name; showLoading(true); hideError(); clearResults();
  const r=new FileReader();
  r.onload=e => { try { showLoading(false); renderAll(analyzeFlowText(e.target.result)); } catch(err) { showLoading(false); showError(err.message); } };
  r.readAsText(file);
}

function processFlowText(text, label) {
  fnLabel.textContent=label||'flow.txt'; showLoading(true); hideError(); clearResults();
  setTimeout(() => { try { showLoading(false); renderAll(analyzeFlowText(text)); } catch(err) { showLoading(false); showError(err.message); } }, 20);
}

function renderAll(data) {
  document.getElementById('stats').style.display='flex';
  document.getElementById('stat-pairs').textContent=data.pair_count;
  document.getElementById('stat-corrs').textContent=data.corr_count;
  document.getElementById('stat-vals').textContent=data.legend.length;
  document.getElementById('corr-badge').textContent=data.corr_count;
  document.getElementById('empty-state').style.display='none';
  document.getElementById('export-btns').style.display='flex';
  window.flowData=data;
  renderPairs(data.pairs); renderCorrelations(data.correlations); renderVisibility(data.legend);
}

function statusClass(s) { const m=s&&s.match(/^(\d)/); return m?({2:'s2xx',3:'s3xx',4:'s4xx',5:'s5xx'}[m[1]]||''):''; }

function renderPairs(pairs) {
  const c=document.getElementById('pairs-container'); c.innerHTML='';
  pairs.forEach(p => {
    const card=document.createElement('div');
    card.className='pair-card'; card.id=`pair-${p.index}`;
    card.innerHTML=`<div class="pair-header"><span class="pair-index">PAIR ${p.index}</span><span class="pair-summary-req">${escHtml(p.request_summary)}</span><span class="arrow">→</span><span class="status-badge ${statusClass(p.response_summary)}">${escHtml(p.response_summary)}</span></div><div class="pair-body"><div class="http-block"><div class="http-block-header req-header-bar"><span>▶</span> REQUEST</div><pre class="http-raw">${p.request_hl}</pre></div><div class="http-block"><div class="http-block-header res-header-bar"><span>◀</span> RESPONSE</div><pre class="http-raw">${p.response_hl}</pre></div></div>`;
    c.appendChild(card);
  });
  c.querySelectorAll('mark.corr-mark').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); const dv=el.getAttribute('data-value'); if(!hiddenValues.has(dv)) focusValue(dv); }));
}

function renderCorrelations(corrs) {
  const list=document.getElementById('corrs-list'), empty=document.getElementById('corrs-empty');
  list.innerHTML=''; if(!corrs.length){empty.style.display='flex';return;} empty.style.display='none';
  corrs.forEach(c => {
    const ev=escapeHtmlEntities(c.value), el=document.createElement('div');
    el.className='corr-entry'; el.dataset.value=c.value; el.dataset.escaped=ev;
    el.innerHTML=`<div class="corr-value-bar"><div class="corr-dot" style="background:${c.color}"></div><span class="corr-value-text" title="${escAttr(c.value)}">${escHtml(truncate(c.value,38))}</span></div><div class="corr-flow"><div class="corr-flow-row"><span class="corr-flow-label lbl-from">FROM</span><span class="corr-flow-loc">RESPONSE_${c.src_index} · ${escHtml(c.src_location)}</span></div><div class="corr-flow-row"><span class="corr-flow-label lbl-to">TO</span><span class="corr-flow-loc">REQUEST_${c.dst_index} · ${escHtml(c.dst_location)}</span></div></div>`;
    el.addEventListener('click', () => { if(!hiddenValues.has(ev)) focusValue(ev,el); });
    list.appendChild(el);
  });
}

function renderVisibility(legend) {
  const list=document.getElementById('vis-list'), empty=document.getElementById('vis-empty');
  list.querySelectorAll('.vis-row').forEach(e=>e.remove());
  if(!legend.length){empty.style.display='flex';return;} empty.style.display='none';
  legend.forEach(l => {
    const ev=escapeHtmlEntities(l.value), row=document.createElement('div');
    row.className='vis-row'; row.dataset.escaped=ev;
    row.innerHTML=`<div class="vis-check checked" style="background:${l.color};border-color:${l.color}">✓</div><div class="vis-swatch" style="background:${l.color}"></div><span class="vis-label" title="${escAttr(l.value)}">${escHtml(truncate(l.value,22))}</span>`;
    row.addEventListener('click', () => toggleVisibility(ev,row));
    list.appendChild(row);
  });
}

function marksByValue(ev) { return Array.from(document.querySelectorAll('mark.corr-mark')).filter(m=>m.getAttribute('data-value')===ev); }

function toggleVisibility(ev, row) {
  const check=row.querySelector('.vis-check');
  if(hiddenValues.has(ev)){hiddenValues.delete(ev);check.classList.replace('unchecked','checked');check.textContent='✓';row.classList.remove('hidden-val');marksByValue(ev).forEach(m=>m.classList.remove('val-hidden'));}
  else{hiddenValues.add(ev);check.classList.replace('checked','unchecked');check.textContent='';row.classList.add('hidden-val');marksByValue(ev).forEach(m=>m.classList.add('val-hidden'));if(activeValue===ev)clearFocus();}
}

function setAllVisibility(visible) {
  document.querySelectorAll('.vis-row').forEach(row => {
    const ev=row.dataset.escaped;
    if(visible&&hiddenValues.has(ev)) toggleVisibility(ev,row);
    if(!visible&&!hiddenValues.has(ev)) toggleVisibility(ev,row);
  });
}

function escapeHtmlEntities(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }

function focusValue(ev, entryEl) {
  if(activeValue===ev){clearFocus();return;} activeValue=ev;
  const all=Array.from(document.querySelectorAll('mark.corr-mark')), matching=all.filter(m=>m.getAttribute('data-value')===ev);
  all.forEach(m=>{if(m.classList.contains('val-hidden'))return;m.classList.toggle('dimmed',m.getAttribute('data-value')!==ev);});
  document.querySelectorAll('.pair-card').forEach(card=>card.classList.toggle('highlighted',matching.some(m=>card.contains(m))));
  if(matching.length) matching[0].scrollIntoView({behavior:'smooth',block:'center'});
  document.querySelectorAll('.corr-entry').forEach(el=>el.classList.toggle('active-entry',el.dataset.escaped===ev));
  if(entryEl){if(activeEntry)activeEntry.classList.remove('active-entry');activeEntry=entryEl;entryEl.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

function clearFocus() {
  activeValue=null;
  document.querySelectorAll('mark.corr-mark').forEach(m=>m.classList.remove('dimmed'));
  document.querySelectorAll('.pair-card').forEach(c=>c.classList.remove('highlighted'));
  document.querySelectorAll('.corr-entry').forEach(e=>e.classList.remove('active-entry'));
}

document.getElementById('flow-area').addEventListener('click', e => { if(!e.target.closest('mark.corr-mark')) clearFocus(); });
document.getElementById('filter-input').addEventListener('input', function() { const q=this.value.toLowerCase(); document.querySelectorAll('.corr-entry').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';}); });

function showLoading(on){document.getElementById('loading').style.display=on?'flex':'none';if(on)document.getElementById('empty-state').style.display='none';}
function showError(msg){const b=document.getElementById('error-banner');b.textContent='✖ '+msg;b.style.display='block';document.getElementById('empty-state').style.display='none';}
function hideError(){document.getElementById('error-banner').style.display='none';}
function clearResults(){
  document.getElementById('pairs-container').innerHTML='';
  document.getElementById('corrs-list').innerHTML='';
  document.getElementById('vis-list').querySelectorAll('.vis-row').forEach(e=>e.remove());
  document.getElementById('stats').style.display='none';
  document.getElementById('corrs-empty').style.display='flex';
  document.getElementById('vis-empty').style.display='flex';
  document.getElementById('corr-badge').textContent='—';
  document.getElementById('export-btns').style.display='none';
  activeValue=null;activeEntry=null;hiddenValues.clear();
}

// ── export ────────────────────────────────────────────────────────────────────

function buildRegex(rawText, value) {
  const occ=[]; let from=0;
  while(true){const i=rawText.indexOf(value,from);if(i===-1)break;occ.push(i);from=i+1;}
  if(!occ.length) return null;
  const SOFT=new Set(['\n','\r','(', ',','<','?','&']);
  function bfi(idx){
    const ai=idx+value.length; let tc=ai<rawText.length?rawText[ai]:'\n';
    if(!tc||/\w/.test(tc)) tc='\n';
    let ps=Math.max(0,idx-60);
    for(let i=idx-1;i>=ps;i--){if(SOFT.has(rawText[i])){ps=i+1;break;}}
    let pf=rawText.slice(ps,idx);
    const lc=pf.slice(-1);
    if((lc==='"'||lc==="'")&&tc===lc){const ex=Math.max(0,ps-60);for(let i=ps-1;i>=ex;i--){if(SOFT.has(rawText[i])){ps=i+1;break;}}pf=rawText.slice(ps,idx);}
    return{prefix:pf,termChar:tc};
  }
  function score(i){const{prefix}=bfi(i);let s=prefix.length;if(prefix.slice(-1)==='=')s-=1000;return s;}
  const bi=occ.reduce((b,i)=>score(i)<score(b)?i:b,occ[0]);
  const{prefix,termChar}=bfi(bi);
  function re(s){return s.replace(/[.*+?^$()|[\]\\]/g,'\\$&');}
  function te(c){if(c==='\n')return'\\n';if(c==='\r')return'\\r';if(c===']')return'\\]';if(c==='\\')return'\\\\';if(c==='^')return'\\^';return c;}
  // End-of-line/end-of-text terminator: exclude \r from the captured value and
  // match a real CRLF (or a bare LF, or literal end of text) rather than just '\n',
  // so the value isn't polluted with a trailing \r on real \r\n-terminated raw HTTP.
  if(termChar==='\n'){
    return`${re(prefix)}([^\r]+)\r`;
  }
  return`${re(prefix)}([^${te(termChar)}]+)${re(termChar)}`;
}

function exportCoookies(){exportAs('flow.coookies');}
function exportFlow(){exportAs('flow.flow');}

function exportAs(filename){
  const data=window.flowData;if(!data)return;
  const v2n={};let cnt=0;
  data.legend.forEach(l=>{const ev=escapeHtmlEntities(l.value);if(hiddenValues.has(ev))return;v2n[l.value]={name:`val_${cnt++}`,source_index:l.source_index,source_location:l.source_location||''};});
  function j2b(loc){return loc.replace(/^body:json:/,'').split('.').map(s=>`['${s}']`).join('');}
  const steps=data.pairs.map(p=>{
    const extr=[],seen=new Set();
    Object.entries(v2n).forEach(([val,info])=>{
      if((info.source_index??-1)!==p.index||seen.has(val))return;
      seen.add(val);
      if(info.source_location.startsWith('body:json:')) extr.push({name:info.name,type:1,value:j2b(info.source_location)});
      else{const rx=buildRegex(p.response_raw,val);if(rx)extr.push({name:info.name,type:2,value:rx});}
    });
    const prefix=filename.endsWith('.flow')?'FLOW':'COOOKIES';
    let rr=p.request_raw;
    Object.entries(v2n).sort((a,b)=>b[0].length-a[0].length).forEach(([val,info])=>{if(info.source_index>=p.index)return;rr=rr.split(val).join(`<${prefix}:${info.name}>`);});
    // Ensure blank line after headers when there is no body
    if(!rr.includes('\r\n\r\n')) rr=rr.trimEnd()+'\r\n\r\n';
    return{name:`step${p.index+1}`,rawRequest:rr,authExtraction:null,extractions:extr};
  });
  const out={flowName:'LazyFlow',steps};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return escHtml(s);}
function truncate(s,n){return s.length>n?s.slice(0,n)+'…':s;}

// ── auto-load: Java ext injects flow data by replacing the marker below ───────
// The ext reads this HTML, replaces __FLOW_DATA__ with the JSON-escaped flow.txt
// content, writes it to a temp file, and opens it in the browser.
// When opened manually (no injection), the marker stays and we skip.
(function(){
  const raw = `__FLOW_DATA__`;
  if(raw==='__FLOW_DATA__'||!raw.trim()) return;
  processFlowText(raw,'flow.txt (from Burp)');
})();
